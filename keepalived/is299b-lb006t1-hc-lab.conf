# is299b-lb006t1-hc-lab
# MASTER для: 10.6.56.245 (VI_5)
# ==========================================

vrrp_script chk_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 1
    fall 2
    rise 1
}

vrrp_script chk_vip_limit {
    script "/etc/keepalived/check_vip_count.sh"
    interval 2
    fall 1
    rise 3
    weight -50
}

# ==========================================
# VI_1 - 10.6.56.241 - BACKUP (мастер на lb001)
# ==========================================
vrrp_instance VI_1 {
    state BACKUP
    interface ens192
    virtual_router_id 51
    priority 110
    advert_int 1
    preempt_delay 30

    authentication {
        auth_type PASS
        auth_pass 12345
    }

    virtual_ipaddress {
        10.6.56.241/25
    }

    track_script {
        chk_nginx
        chk_vip_limit
    }
}

